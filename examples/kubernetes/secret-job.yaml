apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthealth-auth
data:
  config.yaml: "version: v1\ntargets:\n- name: direct-agent\n  type: http\n  endpoint:\
    \ http://demo:8080/auth\n  checks:\n  - reachability\n  - protocol\n  timeout_ms:\
    \ 2000\n  retries: 0\n  budget_ms: 5000\n  auth:\n    bearer_env: AGENT_TOKEN\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agenthealth-auth
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      restartPolicy: Never
      containers:
      - name: agenthealth
        image: ghcr.io/theagenthealth/agenthealth:v0.12.1
        imagePullPolicy: IfNotPresent
        args:
        - check
        - /etc/agenthealth/config.yaml
        - --format
        - json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/agenthealth
          readOnly: true
        env:
        - name: AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: agenthealth-credentials
              key: agent-token
      volumes:
      - name: config
        configMap:
          name: agenthealth-auth
