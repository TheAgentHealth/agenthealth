name: Validate deployment
on: workflow_dispatch
permissions:
  contents: read
  attestations: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # This example runs from the AgentHealth source checkout. In an application
      # repository, vendor the installer at a reviewed immutable source commit.
      - name: Install verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/install_ci_binary.py v0.22.1 "$RUNNER_TEMP/agenthealth"
      - uses: ./integrations/github-action
        with:
          binary: ${{ runner.temp }}/agenthealth
          version: v0.22.1
          configuration: examples/ci/agenthealth.yaml
          report: agenthealth-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agenthealth-junit
          path: agenthealth-junit.xml
          if-no-files-found: warn
          retention-days: 7
