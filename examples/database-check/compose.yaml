# Disposable local test services. Never use these credentials in production.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health-test-password
      POSTGRES_DB: health
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 2s
      timeout: 5s
      retries: 60
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: health
      MYSQL_USER: health
      MYSQL_PASSWORD: health-test-password
      MYSQL_ROOT_PASSWORD: health-root-test-password
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP -h127.0.0.1 -uroot -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 90
  redis:
    image: redis:7.4.5
    command: ["redis-server", "--requirepass", "health-test-password"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "health-test-password", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
  mongo:
    image: mongo:8.0.13
    environment:
      MONGO_INITDB_ROOT_USERNAME: health
      MONGO_INITDB_ROOT_PASSWORD: health-test-password
    ports: ["127.0.0.1:17017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 2s
      timeout: 5s
      retries: 60
