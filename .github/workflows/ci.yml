name: CI
run-name: ${{ inputs.release_sha && format('Pre-release CI {0} {1}', inputs.release_sha, inputs.request_id) || github.event_name }}

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Immutable source commit for pre-release CI (leave empty for ordinary CI)'
        type: string
        default: ''
      request_id:
        description: 'Unique release gate request identifier'
        type: string
        default: ''
      require_kubernetes:
        description: 'Run Kubernetes runtime checks for a synchronized release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kubernetes-changes:
    name: Detect Kubernetes changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Check changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path

          prefixes = ('deploy/kubernetes/', 'deploy/helm/', 'examples/kubernetes/',
                      'tests/kubernetes/')
          files = {'scripts/test_kubernetes.py',
                   'scripts/package_helm.py', 'tests/requirements.txt',
                   'spec/schemas/configuration.schema.json', 'Dockerfile',
                   '.dockerignore', 'go.mod', 'go.sum'}
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', '--no-renames', '-z',
              os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA']
          ]).decode().split('\0')
          # Runtime tests also exercise the executable built into the image.
          relevant = any(path in files or path.startswith(prefixes) or
                         (path.startswith(('cmd/', 'core/', 'adapters/')) and
                          path.endswith('.go') and not path.endswith('_test.go'))
                         for path in paths)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('relevant=' + str(relevant).lower() + '\n')
          PYTHON

  spec-schema-tests:
    defaults:
      run:
        shell: bash
    name: Spec schema tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run spec schema tests
        run: |
          test_paths=(tests/spec)
          for path in tests/test_release_archives.py tests/test_package_release.py tests/test_release_smoke.py tests/test_release_recovery.py tests/test_release_ci.py tests/test_kubernetes_ci.py tests/test_container_image.py tests/test_stabilization_tools.py; do
            if [ -f "$path" ]; then
              test_paths+=("$path")
            fi
          done
          python3 -m pytest "${test_paths[@]}" -v -ra --junitxml=pytest.xml

      - name: Summarize test skips
        if: always()
        shell: bash
        run: |
          if [ -f pytest.xml ] && [ -f scripts/summarize_test_skips.py ]; then
            python3 scripts/summarize_test_skips.py pytest.xml test-skips.md
            cat test-skips.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-spec-schema-tests
          path: |
            pytest.xml
            test-skips.md

  markdown-link-check:
    name: Markdown link check
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

  doc-example-validation:
    name: Doc example validation
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate marked documentation examples
        run: |
          python3 scripts/validate_doc_examples.py
          if [ -f scripts/generate_status.py ]; then python3 scripts/generate_status.py --check; fi

  go-core-tests:
    name: Go core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l core adapters examples cmd)"
      - name: Vet core
        run: go vet ./...
      - name: Test core with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: pip install -r tests/requirements.txt
      - name: Enforce production coverage floor
        run: if [ -f scripts/check_coverage.py ]; then python3 scripts/check_coverage.py coverage.out --minimum 80; fi
      - name: Collect coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
      - name: Validate core example output against the specification
        run: python3 -m pytest tests/core -v -ra --junitxml=pytest.xml

      - name: Summarize test skips
        if: always()
        shell: bash
        run: |
          if [ -f pytest.xml ] && [ -f scripts/summarize_test_skips.py ]; then
            python3 scripts/summarize_test_skips.py pytest.xml test-skips.md
            cat test-skips.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-go-core-tests-${{ matrix.os }}
          path: |
            pytest.xml
            test-skips.md

  vulnerability-scan:
    name: Go vulnerability scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  go-minimum-version:
    name: Go minimum version (1.23)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
      - run: go vet ./...
      - run: go test -race ./...

  official-sdks:
    name: Official SDKs (${{ matrix.sdk }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [current, legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r tests/interop/requirements-${{ matrix.sdk }}.txt
      - run: go build -o /tmp/agenthealth-interop ./cmd/agenthealth
      - name: Test official SDK HTTP and stdio servers
        env:
          AGENTHEALTH_INTEROP: '1'
          AGENTHEALTH_BINARY: /tmp/agenthealth-interop
        run: python -m pytest tests/interop -v -ra --junitxml=pytest.xml

      - name: Summarize test skips
        if: always()
        shell: bash
        run: |
          if [ -f pytest.xml ] && [ -f scripts/summarize_test_skips.py ]; then
            python3 scripts/summarize_test_skips.py pytest.xml test-skips.md
            cat test-skips.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-official-sdks-${{ matrix.sdk }}
          path: |
            pytest.xml
            test-skips.md

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 images
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=v0.0.0-ci .
      - name: Build and smoke-test the linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --build-arg VERSION=v0.0.0-ci --load -t agenthealth:ci .
          python3 scripts/test_container.py agenthealth:ci --version v0.0.0-ci

  binary-distribution:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_sha != '')
    name: Binary distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      # Older source tags may not contain the native smoke helper. Fetch it
      # from the immutable workflow commit without replacing tagged source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: scripts/test_release_binary.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build and smoke-test native archive
        run: |
          python scripts/build_release.py v0.0.0-ci
          python .ci-tools/scripts/test_release_binary.py v0.0.0-ci --output dist
      - name: Build package channels and verify DEB payload
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f scripts/package_release.py ]; then
            python3 scripts/package_release.py v0.0.0-ci
            cd dist
            sha256sum --check checksums.txt
            dpkg-deb --extract agenthealth_v0.0.0-ci_linux_amd64.deb deb-smoke
            test "$(deb-smoke/usr/bin/agenthealth version)" = "agenthealth v0.0.0-ci"
          fi

  kubernetes:
    needs: kubernetes-changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.release_sha != '' && inputs.require_kubernetes) ||
       (github.event_name == 'pull_request' &&
        (needs.kubernetes-changes.result != 'success' ||
         needs.kubernetes-changes.outputs.relevant == 'true')))
    name: Kubernetes manifests and Helm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned Kubernetes tools
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          go install sigs.k8s.io/kind@v0.27.0
          curl -fsSLO https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          pip install -r tests/requirements.txt
      - name: Validate and package chart
        run: |
          python3 -m pytest tests/kubernetes -q -ra --junitxml=pytest.xml
          CHART_TAG=$(python3 -c 'import yaml; print("v" + yaml.safe_load(open("deploy/helm/agenthealth/Chart.yaml"))["version"])')
          python3 scripts/package_helm.py "$CHART_TAG" --output chart-dist
      - name: Runtime scenarios
        run: |
          kind create cluster --name agenthealth-ci --image kindest/node:v1.32.2 --wait 90s
          docker build --build-arg VERSION=v0.0.0-ci -t agenthealth:v0.0.0-ci .
          kind load docker-image agenthealth:v0.0.0-ci --name agenthealth-ci
          docker build -f examples/kubernetes/Dockerfile.exec-probe --build-arg AGENTHEALTH_IMAGE=agenthealth:v0.0.0-ci -t agenthealth-demo-exec:ci .
          test "$(docker run --rm --entrypoint /usr/local/bin/agenthealth agenthealth-demo-exec:ci version)" = "agenthealth v0.0.0-ci"
          kubectl kustomize examples/kubernetes > /tmp/agenthealth-kustomize.yaml
          kubectl --context kind-agenthealth-ci apply --dry-run=server -f /tmp/agenthealth-kustomize.yaml
          python3 scripts/test_kubernetes.py --context kind-agenthealth-ci --image agenthealth:v0.0.0-ci
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name agenthealth-ci
      - name: Summarize test skips
        if: always()
        shell: bash
        run: |
          if [ -f pytest.xml ] && [ -f scripts/summarize_test_skips.py ]; then
            python3 scripts/summarize_test_skips.py pytest.xml test-skips.md
            cat test-skips.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-kubernetes
          path: |
            pytest.xml
            test-skips.md


  parser-fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Fuzz parser boundaries
        if: hashFiles('core/fuzz_test.go') != ''
        run: |
          go test ./core -run '^$' -fuzz '^FuzzLoadConfig$' -fuzztime=10s
          go test ./adapters/mcp -run '^$' -fuzz '^FuzzJSONRPC$' -fuzztime=10s
          go test ./adapters/mcp -run '^$' -fuzz '^FuzzSSE$' -fuzztime=10s
          go test ./adapters/mcp -run '^$' -fuzz '^FuzzOAuthDiscovery$' -fuzztime=10s
          go test ./adapters/a2a -run '^$' -fuzz '^FuzzA2ACard$' -fuzztime=10s
      - name: Collect fuzz regression inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-regressions
          path: '**/testdata/fuzz/**'

  graph-profiles:
    name: Large DAG profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Measure graph allocation and memory
        if: hashFiles('core/benchmark_test.go') != ''
        run: |
          mkdir -p profiles
          go test ./core -run '^$' -bench BenchmarkLargeDAG -benchmem -benchtime=1x -count=3 -memprofile=profiles/dag-memory.out | tee profiles/benchmarks.txt
          go tool pprof -top profiles/dag-memory.out > profiles/memory.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dag-profiles
          path: profiles/

  kubernetes-versions:
    needs: kubernetes-changes
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.release_sha != '' && inputs.require_kubernetes) ||
       (github.event_name == 'pull_request' &&
        (needs.kubernetes-changes.result != 'success' ||
         needs.kubernetes-changes.outputs.relevant == 'true')))
    name: Kubernetes interoperability (${{ matrix.kubernetes }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.31.9'
            node: kindest/node:v1.31.9@sha256:156da58ab617d0cb4f56bbdb4b493f4dc89725505347a4babde9e9544888bb92
          - kubernetes: '1.33.1'
            node: kindest/node:v1.33.1@sha256:8d866994839cd096b3590681c55a6fa4a071fdaf33be7b9660e5697d2ed13002
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned Kubernetes tools
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          go install sigs.k8s.io/kind@v0.28.0
          curl -fsSLO https://dl.k8s.io/release/v${{ matrix.kubernetes }}/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v${{ matrix.kubernetes }}/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          pip install -r tests/requirements.txt
      - name: Validate and package chart
        run: |
          python3 -m pytest tests/kubernetes -q -ra --junitxml=pytest.xml
          CHART_TAG=$(python3 -c 'import yaml; print("v" + yaml.safe_load(open("deploy/helm/agenthealth/Chart.yaml"))["version"])')
          python3 scripts/package_helm.py "$CHART_TAG" --output chart-dist
      - name: Runtime scenarios
        run: |
          kind create cluster --name agenthealth-ci --image ${{ matrix.node }} --wait 90s
          docker build --build-arg VERSION=v0.0.0-ci -t agenthealth:v0.0.0-ci .
          kind load docker-image agenthealth:v0.0.0-ci --name agenthealth-ci
          docker build -f examples/kubernetes/Dockerfile.exec-probe --build-arg AGENTHEALTH_IMAGE=agenthealth:v0.0.0-ci -t agenthealth-demo-exec:ci .
          test "$(docker run --rm --entrypoint /usr/local/bin/agenthealth agenthealth-demo-exec:ci version)" = "agenthealth v0.0.0-ci"
          kubectl kustomize examples/kubernetes > /tmp/agenthealth-kustomize.yaml
          kubectl --context kind-agenthealth-ci apply --dry-run=server -f /tmp/agenthealth-kustomize.yaml
          python3 scripts/test_kubernetes.py --context kind-agenthealth-ci --image agenthealth:v0.0.0-ci
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name agenthealth-ci
      - name: Summarize test skips
        if: always()
        shell: bash
        run: |
          if [ -f pytest.xml ] && [ -f scripts/summarize_test_skips.py ]; then
            python3 scripts/summarize_test_skips.py pytest.xml test-skips.md
            cat test-skips.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-kubernetes-${{ matrix.kubernetes }}
          path: |
            pytest.xml
            test-skips.md


  reference-middleware:
    name: Reference application middleware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test FastAPI and compiled LangGraph handlers
        if: hashFiles('examples/reference/python/requirements.txt') != ''
        run: |
          pip install -r examples/reference/python/requirements.txt
          python -m pytest examples/reference/python -q -ra
      - name: Typecheck and test Express handler
        if: hashFiles('examples/reference/typescript/package-lock.json') != ''
        run: |
          node --version
          npm ci --prefix examples/reference/typescript
          npm --prefix examples/reference/typescript run typecheck
          npm --prefix examples/reference/typescript test

  real-mcp:
    name: Real MCP filesystem server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test passive inventory against a maintained server
        if: hashFiles('tests/interop/test_real_mcp.py') != ''
        env:
          AGENTHEALTH_REAL_MCP: '1'
          AGENTHEALTH_BINARY: /tmp/agenthealth-interop
          AGENTHEALTH_FILESYSTEM_SERVER: /tmp/real-mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js
        run: |
          pip install -r tests/requirements.txt
          npm install --prefix /tmp/real-mcp @modelcontextprotocol/server-filesystem@2026.8.31
          go build -o /tmp/agenthealth-interop ./cmd/agenthealth
          python -m pytest tests/interop/test_real_mcp.py -q -ra --junitxml=pytest.xml
      - name: Collect product test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: real-mcp-report
          path: pytest.xml

  released-configurations:
    name: Released configuration upgrade and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Run released/current/released sequence
        if: hashFiles('scripts/test_config_upgrade.py') != ''
        run: |
          go build -o /tmp/agenthealth-current ./cmd/agenthealth
          python3 scripts/fetch_release_binary.py v0.9.0 /tmp/agenthealth-v090
          python3 scripts/fetch_release_binary.py v0.12.0 /tmp/agenthealth-v0120
          python3 scripts/test_config_upgrade.py /tmp/agenthealth-v090 /tmp/agenthealth-current
          python3 scripts/test_config_upgrade.py /tmp/agenthealth-v0120 /tmp/agenthealth-current

  agentgateway-signal:
    name: Real Agentgateway HTTP health signal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Test product readiness endpoint
        if: hashFiles('scripts/test_agentgateway.py') != ''
        run: |
          go build -o /tmp/agenthealth-current ./cmd/agenthealth
          curl -fsSL https://github.com/agentgateway/agentgateway/releases/download/v1.6.0/agentgateway-linux-amd64 -o /tmp/agentgateway
          echo '496ed27e6a96b55a9ad7cabe5c2be7172511f44a3cb113e533d22bf93a7f079d  /tmp/agentgateway' | sha256sum --check
          chmod +x /tmp/agentgateway
          python3 scripts/test_agentgateway.py /tmp/agenthealth-current /tmp/agentgateway

  router-signal:
    name: Real LiteLLM router HTTP health signal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test product process liveness without model calls
        if: hashFiles('scripts/test_router.py') != ''
        run: |
          pip install 'litellm[proxy]==1.104.2'
          go build -o /tmp/agenthealth-current ./cmd/agenthealth
          python3 scripts/test_router.py /tmp/agenthealth-current "$(command -v litellm)"
