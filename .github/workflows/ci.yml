name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-schema-tests:
    name: Spec schema tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run spec schema tests
        run: python3 -m pytest tests/spec tests/test_release_archives.py tests/test_package_release.py tests/test_release_smoke.py tests/test_release_recovery.py tests/test_container_image.py -v

  markdown-link-check:
    name: Markdown link check
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

  doc-example-validation:
    name: Doc example validation
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate marked documentation examples
        run: python3 scripts/validate_doc_examples.py

  go-core-tests:
    name: Go core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l core adapters examples cmd)"
      - name: Vet core
        run: go vet ./...
      - name: Test core with race detector
        run: go test -race ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate core example output against the specification
        run: python3 -m pytest tests/core -v

  vulnerability-scan:
    name: Go vulnerability scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  go-minimum-version:
    name: Go minimum version (1.23)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
      - run: go vet ./...
      - run: go test -race ./...

  official-sdks:
    name: Official SDKs (${{ matrix.sdk }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [current, legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r tests/interop/requirements-${{ matrix.sdk }}.txt
      - run: go build -o /tmp/agenthealth-interop ./cmd/agenthealth
      - name: Test official SDK HTTP and stdio servers
        env:
          AGENTHEALTH_INTEROP: '1'
          AGENTHEALTH_BINARY: /tmp/agenthealth-interop
        run: python -m pytest tests/interop -v

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 images
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=v0.0.0-ci .
      - name: Build and smoke-test the linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --build-arg VERSION=v0.0.0-ci --load -t agenthealth:ci .
          python3 scripts/test_container.py agenthealth:ci --version v0.0.0-ci

  binary-distribution:
    name: Binary distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build and smoke-test native archive
        run: |
          python scripts/build_release.py v0.0.0-ci
          python scripts/test_release_binary.py v0.0.0-ci --output dist
      - name: Build package channels and verify DEB payload
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/package_release.py v0.0.0-ci
          cd dist
          sha256sum --check checksums.txt
          dpkg-deb --extract agenthealth_v0.0.0-ci_linux_amd64.deb deb-smoke
          test "$(deb-smoke/usr/bin/agenthealth version)" = "agenthealth v0.0.0-ci"

  kubernetes:
    name: Kubernetes manifests and Helm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned Kubernetes tools
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          go install sigs.k8s.io/kind@v0.27.0
          curl -fsSLO https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          pip install -r tests/requirements.txt
      - name: Validate and package chart
        run: |
          python3 -m pytest tests/kubernetes -q
          CHART_TAG=$(python3 -c 'import yaml; print("v" + yaml.safe_load(open("deploy/helm/agenthealth/Chart.yaml"))["version"])')
          python3 scripts/package_helm.py "$CHART_TAG" --output chart-dist
      - name: Runtime scenarios
        run: |
          kind create cluster --name agenthealth-ci --image kindest/node:v1.32.2 --wait 90s
          docker build --build-arg VERSION=v0.0.0-ci -t agenthealth:v0.0.0-ci .
          kind load docker-image agenthealth:v0.0.0-ci --name agenthealth-ci
          docker build -f examples/kubernetes/Dockerfile.exec-probe --build-arg AGENTHEALTH_IMAGE=agenthealth:v0.0.0-ci -t agenthealth-demo-exec:ci .
          test "$(docker run --rm --entrypoint /usr/local/bin/agenthealth agenthealth-demo-exec:ci version)" = "agenthealth v0.0.0-ci"
          kubectl kustomize examples/kubernetes > /tmp/agenthealth-kustomize.yaml
          kubectl --context kind-agenthealth-ci apply --dry-run=server -f /tmp/agenthealth-kustomize.yaml
          python3 scripts/test_kubernetes.py --context kind-agenthealth-ci --image agenthealth:v0.0.0-ci
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name agenthealth-ci
