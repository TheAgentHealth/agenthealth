name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-schema-tests:
    name: Spec schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run spec schema tests
        run: python3 -m pytest tests/spec -v

  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

  doc-example-validation:
    name: Doc example validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate marked documentation examples
        run: python3 scripts/validate_doc_examples.py

  go-core-tests:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l core adapters examples cmd)"
      - name: Vet core
        run: go vet ./...
      - name: Test core with race detector
        run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate core example output against the specification
        run: python3 -m pytest tests/core -v
