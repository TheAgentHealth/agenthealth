name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-schema-tests:
    name: Spec schema tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run spec schema tests
        run: python3 -m pytest tests/spec tests/test_release_archives.py tests/test_container_image.py -v

  markdown-link-check:
    name: Markdown link check
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

  doc-example-validation:
    name: Doc example validation
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate marked documentation examples
        run: python3 scripts/validate_doc_examples.py

  go-core-tests:
    name: Go core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l core adapters examples cmd)"
      - name: Vet core
        run: go vet ./...
      - name: Test core with race detector
        run: go test -race ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validation dependencies
        run: pip install -r tests/requirements.txt
      - name: Validate core example output against the specification
        run: python3 -m pytest tests/core -v

  vulnerability-scan:
    name: Go vulnerability scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  go-minimum-version:
    name: Go minimum version (1.23)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
      - run: go vet ./...
      - run: go test -race ./...

  official-sdks:
    name: Official SDKs (${{ matrix.sdk }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [current, legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r tests/interop/requirements-${{ matrix.sdk }}.txt
      - run: go build -o /tmp/agenthealth-interop ./cmd/agenthealth
      - name: Test official SDK HTTP and stdio servers
        env:
          AGENTHEALTH_INTEROP: '1'
          AGENTHEALTH_BINARY: /tmp/agenthealth-interop
        run: python -m pytest tests/interop -v

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 images
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=v0.0.0-ci .
      - name: Build and smoke-test the linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --build-arg VERSION=v0.0.0-ci --load -t agenthealth:ci .
          python3 scripts/test_container.py agenthealth:ci --version v0.0.0-ci
