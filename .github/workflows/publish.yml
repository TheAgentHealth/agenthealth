name: Publish npm
run-name: npm ${{ inputs.release_tag }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable software tag whose signed draft contains the npm tarball'
        required: true
        type: string
      request_id:
        description: 'Coordinating Release workflow run-attempt identity'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/tags/{0}', inputs.release_tag)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify immutable tag and signed staged npm artifact
        run: python3 scripts/verify_npm_publication.py "$RELEASE_TAG" --output npm-dist
      - name: Publish exact signed tarball through npm OIDC
        run: |
          npm --version
          if [ ! -f npm-dist/already-published ]; then
            if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; else channel=latest; fi
            npm publish npm-dist/theagenthealth-agenthealth-*.tgz --access public --provenance --ignore-scripts --tag "$channel"
          fi
      - name: Verify public registry bytes and signed provenance
        run: python3 scripts/verify_npm_publication.py "$RELEASE_TAG" --output npm-dist --registry
      - name: Verify installed registry package signatures
        run: |
          mkdir registry-check
          cd registry-check
          npm init -y
          npm install --ignore-scripts --save-exact "@theagenthealth/agenthealth@${RELEASE_TAG#v}"
          npm audit signatures
