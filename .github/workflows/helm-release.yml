name: Helm chart release

on:
  push:
    tags: ['helm-v*']

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          pip install -r tests/requirements.txt
      - name: Validate and package component
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m pytest tests/kubernetes -q
          python3 scripts/check_markdown_links.py
          python3 scripts/package_helm.py "$RELEASE_TAG" --output chart-dist
      - name: Publish chart release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" chart-dist/agenthealth-*.tgz chart-dist/checksums.txt \
            --verify-tag --latest=false --title "AgentHealth chart ${RELEASE_TAG#helm-v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
