name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate tagged source
        run: |
          test -z "$(gofmt -l core adapters examples cmd)"
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go test -race ./...
          pip install -r tests/requirements.txt
          python3 -m pytest tests -q
          python3 scripts/check_markdown_links.py
          python3 scripts/validate_doc_examples.py
      - name: Build archives and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG"
      - name: Verify Linux binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir smoke
          tar -xzf "dist/agenthealth_${RELEASE_TAG}_linux_amd64.tar.gz" -C smoke
          test "$(smoke/agenthealth version)" = "agenthealth $RELEASE_TAG"
          smoke/agenthealth --help
          cd dist
          sha256sum --check checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'dist/*'
      - name: Attest linux/amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist/agenthealth_${{ github.ref_name }}_linux_amd64.tar.gz'
          sbom-path: 'dist/agenthealth_${{ github.ref_name }}_linux_amd64.cdx.json'
      - name: Attest linux/arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist/agenthealth_${{ github.ref_name }}_linux_arm64.tar.gz'
          sbom-path: 'dist/agenthealth_${{ github.ref_name }}_linux_arm64.cdx.json'
      - name: Attest darwin/amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist/agenthealth_${{ github.ref_name }}_darwin_amd64.tar.gz'
          sbom-path: 'dist/agenthealth_${{ github.ref_name }}_darwin_amd64.cdx.json'
      - name: Attest darwin/arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist/agenthealth_${{ github.ref_name }}_darwin_arm64.tar.gz'
          sbom-path: 'dist/agenthealth_${{ github.ref_name }}_darwin_arm64.cdx.json'
      - name: Attest windows/amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist/agenthealth_${{ github.ref_name }}_windows_amd64.zip'
          sbom-path: 'dist/agenthealth_${{ github.ref_name }}_windows_amd64.cdx.json'
      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft "${release_flags[@]}" --title "AgentHealth $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG}.md"
          gh release edit "$RELEASE_TAG" --draft=false
