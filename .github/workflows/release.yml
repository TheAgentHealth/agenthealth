name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable tag for infrastructure-only release recovery'
        required: true
        type: string
      publication_only:
        description: 'Reuse signed assets/packages; recover npm/PyPI publication and finalize'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.publication_only }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate tagged source
        run: |
          test -z "$(gofmt -l core adapters examples cmd)"
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go test -race ./...
          pip install -r tests/requirements.txt
          python3 -m pytest tests -q
          python3 scripts/check_markdown_links.py
          python3 scripts/validate_doc_examples.py

  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      # Use the current helper even when recovering an older source tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Trigger and require pre-release CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          required_checks=(--dispatch)
          if git cat-file -e "$source_sha:scripts/prepare_synchronized_release.py" 2>/dev/null; then
            required_checks+=(--require-kubernetes)
          fi
          if git cat-file -e "$source_sha:sdk/python/pyproject.toml" 2>/dev/null; then
            required_checks+=(--require-python)
          fi
          if git cat-file -e "$source_sha:sdk/javascript/package.json" 2>/dev/null; then
            required_checks+=(--require-javascript)
          fi
          python3 scripts/wait_for_release_ci.py "$source_sha" "${required_checks[@]}"

  release:
    # Stage signed files; publish only after container and OCI packages succeed.
    needs: [validate, ci-gate]
    outputs:
      synchronized: ${{ steps.layout.outputs.synchronized }}
      python: ${{ steps.layout.outputs.python }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Identify release layout
        id: layout
        run: |
          if [ -f scripts/prepare_synchronized_release.py ]; then
            echo "synchronized=true" >> "$GITHUB_OUTPUT"
          else
            echo "synchronized=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f sdk/python/pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python packaging dependencies
        if: steps.layout.outputs.python == 'true'
        run: pip install build==1.2.2.post1 twine==6.1.0
      - name: Install chart packaging dependency
        if: steps.layout.outputs.synchronized == 'true'
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          pip install PyYAML==6.0.2
      - name: Build archives and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/build_release.py "$RELEASE_TAG"
          if [ -f scripts/package_release.py ]; then
            python3 scripts/package_release.py "$RELEASE_TAG"
          fi
          if [ -f scripts/prepare_synchronized_release.py ]; then
            python3 scripts/prepare_synchronized_release.py "$RELEASE_TAG" --output dist
          fi
      - name: Verify Linux binary
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir smoke
          tar -xzf "dist/agenthealth_${RELEASE_TAG}_linux_amd64.tar.gz" -C smoke
          test "$(smoke/agenthealth version)" = "agenthealth $RELEASE_TAG"
          smoke/agenthealth --help
          cd dist
          sha256sum --check checksums.txt
      - name: Verify existing provenance during recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners
          done
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Attest linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_linux_amd64.tar.gz'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_linux_amd64.cdx.json'
      - name: Attest linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_linux_arm64.tar.gz'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_linux_arm64.cdx.json'
      - name: Attest darwin/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_darwin_amd64.tar.gz'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_darwin_amd64.cdx.json'
      - name: Attest darwin/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_darwin_arm64.tar.gz'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_darwin_arm64.cdx.json'
      - name: Attest windows/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_windows_amd64.zip'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/agenthealth_${{ inputs.release_tag || github.ref_name }}_windows_amd64.cdx.json'
      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
      - name: Stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          release_flags=(--latest=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft "${release_flags[@]}" --title "AgentHealth $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG}.md"

  container:
    # Runs in parallel with release once validation and the CI gate pass. Image binaries are
    # compared against a freshly built reference binary instead of the
    # release job's archives, so this job has no dependency on it.
    needs: [validate, ci-gate]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      docker_digest: ${{ steps.push_dockerhub.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      IMAGE: ghcr.io/theagenthealth/agenthealth
      DOCKERHUB_IMAGE: theagenthealth/agenthealth
      # if: cannot reference secrets directly, so pass them through env instead.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify image binaries match a freshly built reference binary
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --build-arg VERSION="$RELEASE_TAG" --output "type=local,dest=image-$arch" .
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "ref-$arch" ./cmd/agenthealth
            cmp "image-$arch/usr/local/bin/agenthealth" "ref-$arch"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.RELEASE_TAG }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test published GHCR image as an unauthenticated user
        run: |
          docker logout ghcr.io
          image="$IMAGE@${{ steps.push.outputs.digest }}"
          test "$(docker run --rm "$image" version)" = "agenthealth $RELEASE_TAG"
          docker run --rm "$image" --help
      # Docker Hub mirror is optional: it only runs once DOCKERHUB_USERNAME/DOCKERHUB_ACCESS_TOKEN both exist.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_ACCESS_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_ACCESS_TOKEN }}
      - id: meta_dockerhub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_ACCESS_TOKEN != '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
      - id: push_dockerhub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_ACCESS_TOKEN != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.RELEASE_TAG }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
      - name: Smoke-test published Docker Hub image as an unauthenticated user
        if: ${{ steps.push_dockerhub.outcome == 'success' }}
        run: |
          docker logout
          image="docker.io/$DOCKERHUB_IMAGE@${{ steps.push_dockerhub.outputs.digest }}"
          test "$(docker run --rm "$image" version)" = "agenthealth $RELEASE_TAG"
          docker run --rm "$image" --help

  packages:
    needs: release
    if: needs.release.outputs.synchronized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart_digest: ${{ steps.oci.outputs.chart_digest }}
      binary_digest: ${{ steps.oci.outputs.binary_digest }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Install pinned registry tools
        run: |
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          go install oras.land/oras/cmd/oras@v1.3.0
          pip install PyYAML==6.0.2
      - name: Verify signed assets before registry publication
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners
          done
      - name: Authenticate package clients
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish same-version chart and binary bundle
        id: oci
        run: python3 scripts/publish_oci.py "$RELEASE_TAG" --output dist --report oci-report.json
      - name: Attest OCI chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/theagenthealth/charts/agenthealth
          subject-digest: ${{ steps.oci.outputs.chart_digest }}
          push-to-registry: true
      - name: Attest OCI binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/theagenthealth/agenthealth-binaries
          subject-digest: ${{ steps.oci.outputs.binary_digest }}
          push-to-registry: true
      - name: Verify public manifests and every downloadable blob
        run: python3 scripts/publish_oci.py "$RELEASE_TAG" --output dist --report oci-report.json --verify-public
      - name: Verify Helm and ORAS client downloads match signed assets
        run: |
          mkdir pulled-chart
          helm pull oci://ghcr.io/theagenthealth/charts/agenthealth --version "${RELEASE_TAG#v}" --destination pulled-chart
          cmp "dist/agenthealth-${RELEASE_TAG#v}.tgz" "pulled-chart/agenthealth-${RELEASE_TAG#v}.tgz"
          oras pull "ghcr.io/theagenthealth/agenthealth-binaries@${{ steps.oci.outputs.binary_digest }}" --output pulled-bundle
          python3 -c 'from pathlib import Path; original={p.name:p.read_bytes() for p in Path("dist").iterdir()}; pulled={p.name:p.read_bytes() for p in Path("pulled-bundle").iterdir()}; assert original==pulled, "OCI bundle differs from signed release files"'
      - name: Verify signed OCI references
        run: |
          gh attestation verify "oci://ghcr.io/theagenthealth/charts/agenthealth@${{ steps.oci.outputs.chart_digest }}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners
          gh attestation verify "oci://ghcr.io/theagenthealth/agenthealth-binaries@${{ steps.oci.outputs.binary_digest }}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners

  pypi:
    needs: [release, container, packages]
    if: needs.release.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agenthealth/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release-assets
      - name: Select checksum-verified Python distributions
        run: |
          cd release-assets
          sha256sum --check checksums.txt
          mkdir ../python-dist
          cp agenthealth-*.whl agenthealth-*.tar.gz ../python-dist/
      - name: Publish identical release artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: python-dist/
          attestations: true

  recover-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_only
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      synchronized: ${{ steps.verify.outputs.synchronized }}
      image_digest: ${{ steps.verify.outputs.image_digest }}
      docker_digest: ${{ steps.verify.outputs.docker_digest }}
      chart_digest: ${{ steps.verify.outputs.chart_digest }}
      binary_digest: ${{ steps.verify.outputs.binary_digest }}
    steps:
      # Current recovery tooling verifies artifacts from the immutable source tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Verify existing draft, signed assets and immutable packages
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/recover_publication.py "$RELEASE_TAG" --output recovery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovered-python-dist
          path: recovery/python/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-recovery-verification
          path: |
            recovery/verified-inputs.json
            recovery/oci-report.json

  recover-pypi:
    needs: recover-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agenthealth/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: recovered-python-dist
          path: python-dist
      - name: Verify any already-published PyPI bytes before idempotent recovery
        run: python3 scripts/verify_pypi_publication.py "$RELEASE_TAG" --output python-dist
      - name: Publish original verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0 commit, not annotated tag object
        with:
          packages-dir: python-dist/
          attestations: true
          skip-existing: true

  npm:
    needs: [release, container, packages, recover-assets]
    if: >-
      always() && ((needs.release.result == 'success' && needs.container.result == 'success' &&
      (needs.packages.result == 'success' ||
       (needs.packages.result == 'skipped' && needs.release.outputs.synchronized != 'true'))) ||
      needs.recover-assets.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@theagenthealth/agenthealth
    permissions:
      # Reading the signed staged draft requires write access.
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      NPM_PUBLICATION_RECOVERY: ${{ inputs.publication_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.publication_only && github.sha || inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Identify whether the tagged source includes the npm SDK
        id: layout
        run: |
          if git cat-file -e "$RELEASE_TAG:sdk/javascript/package.json" 2>/dev/null; then
            echo "javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "javascript=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify immutable tag and signed staged npm artifact
        if: steps.layout.outputs.javascript == 'true'
        run: python3 scripts/verify_npm_publication.py "$RELEASE_TAG" --output npm-dist
      - name: Publish exact signed tarball through npm OIDC
        if: steps.layout.outputs.javascript == 'true'
        run: |
          npm --version
          if [ ! -f npm-dist/already-published ]; then
            python3 scripts/verify_npm_oidc.py
            unset NODE_AUTH_TOKEN NPM_TOKEN
            printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
            if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; else channel=latest; fi
            npm publish ./npm-dist/theagenthealth-agenthealth-*.tgz --access public --provenance --ignore-scripts --tag "$channel"
          fi
      - name: Verify public registry bytes and signed provenance
        if: steps.layout.outputs.javascript == 'true'
        run: python3 scripts/verify_npm_publication.py "$RELEASE_TAG" --output npm-dist --registry
      - name: Verify installed registry package signatures
        if: steps.layout.outputs.javascript == 'true'
        run: |
          mkdir registry-check
          cd registry-check
          npm init -y
          npm install --ignore-scripts --save-exact "@theagenthealth/agenthealth@${RELEASE_TAG#v}"
          npm audit signatures

  publish:
    needs: [release, container, packages, pypi, npm, recover-assets, recover-pypi]
    if: >-
      always() && needs.npm.result == 'success' && ((needs.release.result == 'success' && needs.container.result == 'success' &&
      (needs.pypi.result == 'success' ||
       (needs.pypi.result == 'skipped' && needs.release.outputs.python != 'true')) &&
      (needs.packages.result == 'success' ||
       (needs.packages.result == 'skipped' && needs.release.outputs.synchronized != 'true'))) ||
      (needs.recover-assets.result == 'success' && needs.recover-pypi.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SYNCHRONIZED: ${{ needs.release.outputs.synchronized || needs.recover-assets.outputs.synchronized }}
      IMAGE_DIGEST: ${{ needs.container.outputs.image_digest || needs.recover-assets.outputs.image_digest }}
      DOCKER_DIGEST: ${{ needs.container.outputs.docker_digest || needs.recover-assets.outputs.docker_digest }}
      CHART_DIGEST: ${{ needs.packages.outputs.chart_digest || needs.recover-assets.outputs.chart_digest }}
      BINARY_DIGEST: ${{ needs.packages.outputs.binary_digest || needs.recover-assets.outputs.binary_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.publication_only && github.sha || inputs.release_tag || github.ref_name }}
      - name: Attach package links and exact digests
        if: env.SYNCHRONIZED == 'true'
        run: |
          python3 scripts/release_notes.py "$RELEASE_TAG" --output published-notes.md
          gh release edit "$RELEASE_TAG" --notes-file published-notes.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote verified GHCR image aliases
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        run: |
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          docker buildx imagetools create --tag ghcr.io/theagenthealth/agenthealth:latest --tag "ghcr.io/theagenthealth/agenthealth:v$major" "ghcr.io/theagenthealth/agenthealth@$IMAGE_DIGEST"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ !contains(env.RELEASE_TAG, '-') && env.DOCKER_DIGEST != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Promote verified Docker Hub aliases
        if: ${{ !contains(env.RELEASE_TAG, '-') && env.DOCKER_DIGEST != '' }}
        run: |
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          docker buildx imagetools create --tag theagenthealth/agenthealth:latest --tag "theagenthealth/agenthealth:v$major" "theagenthealth/agenthealth@$DOCKER_DIGEST"
      - name: Publish complete release
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"

  dockerhub:
    name: Record verified Docker Hub deployment
    needs: [publish, container, recover-assets]
    # A successful GHCR-only release must not claim a Docker Hub deployment.
    if: >-
      always() && needs.publish.result == 'success' &&
      (needs.container.outputs.docker_digest != '' || needs.recover-assets.outputs.docker_digest != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/theagenthealth/agenthealth
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DOCKER_DIGEST: ${{ needs.container.outputs.docker_digest || needs.recover-assets.outputs.docker_digest }}
    steps:
      - name: Record published and verified image
        run: |
          printf 'Verified Docker Hub deployment: %s (%s)\n' "$RELEASE_TAG" "$DOCKER_DIGEST"
