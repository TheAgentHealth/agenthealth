name: Interoperability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sdks:
    name: Official SDKs (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [current, legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r tests/interop/requirements-${{ matrix.sdk }}.txt
      - run: go build -o /tmp/agenthealth-interop ./cmd/agenthealth
      - name: Test official SDK HTTP and stdio servers
        env:
          AGENTHEALTH_INTEROP: '1'
          AGENTHEALTH_BINARY: /tmp/agenthealth-interop
        run: python -m pytest tests/interop -v
