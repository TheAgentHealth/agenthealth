apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - secret.yaml
  - init-container.yaml
  - deployment-validation-job.yaml
  - cronjob.yaml
configMapGenerator:
  - name: agenthealth-config
    files:
      - agenthealth.yaml
images:
  # Pin a published release; image tags omit the leading "v".
  - name: ghcr.io/theagenthealth/agenthealth
    newTag: "0.5.0"
