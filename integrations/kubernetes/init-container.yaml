# Gate application start-up on its supporting dependencies. The init container
# exits non-zero until every target is HEALTHY, and Kubernetes retries it with
# back-off, so the agent container starts only after dependencies are ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
  labels:
    app.kubernetes.io/name: research-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: research-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-agent
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: ghcr.io/theagenthealth/agenthealth
          args: [check, /etc/agenthealth/agenthealth.yaml]
          envFrom:
            - secretRef:
                name: agenthealth-credentials
          volumeMounts:
            - name: agenthealth-config
              mountPath: /etc/agenthealth
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: agent
          image: registry.example.com/research-agent:1.0.0
          ports:
            - containerPort: 8080
          # Keep your application's own securityContext and probes here.
      volumes:
        - name: agenthealth-config
          configMap:
            name: agenthealth-config
