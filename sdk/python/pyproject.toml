[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthealth"
version = "0.13.1"
description = "Typed synchronous and asynchronous Python access to the AgentHealth CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "TheAgentHealth"}]
dependencies = ["jsonschema>=4.18,<5", "PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TheAgentHealth/agenthealth"
Documentation = "https://github.com/TheAgentHealth/agenthealth/blob/main/docs/python-sdk.md"
Issues = "https://github.com/TheAgentHealth/agenthealth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenthealth = ["py.typed", "schemas/*.json"]
